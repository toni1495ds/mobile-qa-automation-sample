appId: com.macadamapp
tags:
  - smoke
---
- runScript: ../scripts/create_user.js
- launchApp:
    clearState: true
    permissions:
      all: allow
- runFlow:
    file: login.yaml
    env:
      EMAIL: ${output.user.email}
      PASSWORD: ${output.user.password}
- assertVisible:
    id: "steps-today"
- assertVisible:
    id: "coins-balance"
